{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Consent</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'core/favicon.ico' %}"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2.5em;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .button-group form {
            display: inline;
            margin: 0 10px;
        }
        .button-group button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button-group button:hover {
            background-color: #2980b9;
        }
        .button-group button.secondary {
            background-color: #e74c3c;
        }
        .button-group button.secondary:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Consent Form</h1>
        <p>By clicking "I Agree", you consent to having your test submission and details saved for evaluation. If you do not wish to proceed, you will be logged out.</p>
        <div class="button-group">
            <form action="{% url 'test_consent' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="consent" value="yes">
                <button type="submit">I Agree</button>
            </form>
            <form action="{% url 'test_consent' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="consent" value="no">
                <button type="submit" class="secondary">No</button>
            </form>
        </div>
    </div>
</body>
</html>
